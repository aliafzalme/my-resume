<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ali Afzal - Resume</title>
    <script type="text/javascript">
      /*
       * GitHub Pages serves static files only, so a deep link like
       * /my-resume/v2/my-resume has no file behind it and lands here. Encode the
       * requested route into a query string and bounce to index.html, where the
       * snippet in <head> restores it before React Router boots.
       * Adapted from rafgraph/spa-github-pages.
       *
       * pathSegmentsToKeep = 1 because the app is hosted under /my-resume/.
       */
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
